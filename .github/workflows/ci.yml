name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PASSWORD: forge-ci-db-password
      MYSQL_ROOT_PASSWORD: forge-ci-root-password
      JWT_SECRET: forge-ci-only-secret-0123456789-abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Start the container stack
        run: docker compose up --build --detach
      - name: Smoke test the running application
        run: |
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs
            exit 1
          fi
          node scripts/smoke-test.mjs
          curl --fail --silent http://localhost:3001/ >/dev/null
      - name: Stop the container stack
        if: always()
        run: docker compose down --volumes
